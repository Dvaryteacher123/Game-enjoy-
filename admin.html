<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVARY GAMES - Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: left; }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #007bff; color: white; border: none; padding: 10px; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0056b3; }
        .toggle-btn { background: none; color: #007bff; border: none; cursor: pointer; margin-top: 15px; width: 100%; text-align: center; font-size: 14px; text-decoration: underline; }
        .error { color: red; font-size: 14px; text-align: center; margin-bottom: 10px; }
        .hidden { display: none; }
        .game-item { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 10px; margin-bottom: 8px; border-radius: 4px; border: 1px solid #ddd; }
        .delete-btn { background: #dc3545; width: auto; padding: 5px 10px; font-size: 12px; margin: 0; }
        .delete-btn:hover { background: #c82333; }
    </style>
</head>
<body>

<div class="container">
    <!-- SEHEMU YA AUTHENTICATION (Sign In / Sign Up) -->
    <div id="auth-section">
        <h2 id="form-title">Admin Sign In</h2>
        <div id="msg" class="error"></div>

        <form id="auth-form">
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" required placeholder="Weka email yako">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="password" required placeholder="Weka password">
            </div>
            <button type="submit" id="auth-btn">Ingia (Sign In)</button>
        </form>

        <!-- Kitufe cha kubadilisha kati ya Sign In na Sign Up -->
        <button type="button" id="toggle-auth-mode" class="toggle-btn">Hauna akaunti? Bofya hapa kujisajili (Sign Up)</button>
    </div>

    <!-- SEHEMU YA ADMIN DASHBOARD (Inaonekana ukisha-login) -->
    <div id="dashboard-section" class="hidden">
        <h2>Admin Dashboard</h2>
        <p>Umelogin kama: <span id="user-email-display" style="font-weight:bold; color:green;"></span></p>
        <button id="logout-btn" style="background: #6c757d;">Toka (Log Out)</button>
        
        <hr style="margin: 20px 0;">

        <h3>Ongeza Game Mpya</h3>
        <form id="add-game-form">
            <div class="form-group">
                <label>Jina la Game:</label>
                <input type="text" id="game-title" required placeholder="Mfano: Car Racing">
            </div>
            <div class="form-group">
                <label>Maelezo:</label>
                <textarea id="game-desc" required placeholder="Maelezo mafupi ya game..."></textarea>
            </div>
            <div class="form-group">
                <label>Link ya Game:</label>
                <input type="url" id="game-url" required placeholder="https://...">
            </div>
            <button type="submit">Weka Game</button>
        </form>

        <hr style="margin: 20px 0;">

        <h3>Orodha ya Michezo (Futa)</h3>
        <div id="admin-games-list">Inapakia...</div>
    </div>
</div>

<!-- Kuunganisha na app.js -->
<script type="module">
    import { 
        loginUser, 
        signupUser, 
        logoutUser, 
        onAuthStateChanged, 
        isAdminUser, 
        getGames, 
        addGame, 
        deleteGame 
    } from "./app.js";

    const authSection = document.getElementById("auth-section");
    const dashboardSection = document.getElementById("dashboard-section");
    const authForm = document.getElementById("auth-form");
    const formTitle = document.getElementById("form-title");
    const authBtn = document.getElementById("auth-btn");
    const toggleAuthModeBtn = document.getElementById("toggle-auth-mode");
    const msgDiv = document.getElementById("msg");
    const userEmailDisplay = document.getElementById("user-email-display");
    const logoutBtn = document.getElementById("logout-btn");
    const addGameForm = document.getElementById("add-game-form");
    const adminGamesList = document.getElementById("admin-games-list");

    let isSignUpMode = false;

    // Kubadilisha maandishi na kazi kati ya Sign In na Sign Up
    toggleAuthModeBtn.addEventListener("click", () => {
        isSignUpMode = !isSignUpMode;
        if (isSignUpMode) {
            formTitle.innerText = "Admin Sign Up";
            authBtn.innerText = "Jisajili (Sign Up)";
            toggleAuthModeBtn.innerText = "Una akaunti tayari? Bofya hapa kuingia (Sign In)";
        } else {
            formTitle.innerText = "Admin Sign In";
            authBtn.innerText = "Ingia (Sign In)";
            toggleAuthModeBtn.innerText = "Hauna akaunti? Bofya hapa kujisajili (Sign Up)";
        }
        msgDiv.innerText = "";
    });

    // Kufanya Login au Sign Up
    authForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        msgDiv.innerText = "";

        try {
            if (isSignUpMode) {
                await signupUser(email, password);
                alert("Akaunti imetengenezwa na umeingia!");
            } else {
                await loginUser(email, password);
            }
        } catch (error) {
            msgDiv.innerText = error.message;
        }
    });

    // Kusikiliza hali ya mtumiaji
    onAuthStateChanged(async (user) => {
        if (user) {
            if (isAdminUser(user)) {
                authSection.classList.add("hidden");
                dashboardSection.classList.remove("hidden");
                userEmailDisplay.innerText = user.email;
                loadAdminGamesList();
            } else {
                alert("Akaunti hii haina ruhusa ya kuwa admin!");
                await logoutUser();
            }
        } else {
            authSection.classList.remove("hidden");
            dashboardSection.classList.add("hidden");
        }
    });

    // Logout
    logoutBtn.addEventListener("click", async () => {
        await logoutUser();
    });

    // Kuongeza Game
    addGameForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const title = document.getElementById("game-title").value;
        const description = document.getElementById("game-desc").value;
        const gameUrl = document.getElementById("game-url").value;

        try {
            await addGame({ title, description, gameUrl });
            alert("Game imeongezwa kikamilifu!");
            addGameForm.reset();
            loadAdminGamesList();
        } catch (error) {
            alert(error.message);
        }
    });

    // Kuleta orodha ya games upande wa admin
    async function loadAdminGamesList() {
        adminGamesList.innerHTML = "Inapakia...";
        try {
            const games = await getGames();
            if (games.length === 0) {
                adminGamesList.innerHTML = "<p>Hakuna michezo.</p>";
                return;
            }

            adminGamesList.innerHTML = "";
            games.forEach(game => {
                const item = document.createElement("div");
                item.className = "game-item";
                item.innerHTML = `
                    <span><b>${game.title}</b></span>
                    <button class="delete-btn" data-id="${game.id}">Futa</button>
                `;
                item.querySelector(".delete-btn").addEventListener("click", async () => {
                    if (confirm(`Una uhakika unataka kufuta "${game.title}"?`)) {
                        try {
                            await deleteGame(game.id);
                            loadAdminGamesList();
                        } catch (err) {
                            alert(err.message);
                        }
                    }
                });
                adminGamesList.appendChild(item);
            });
        } catch (error) {
            adminGamesList.innerHTML = "<p>Imeshindwa kupakia michezo.</p>";
        }
    }
</script>
</body>
</html>
