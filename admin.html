<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DVARY GAMES - Admin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f0f1a;
      color: #f0f0f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 2px solid #2a2a40;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    header h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-actions {
      display: flex;
      gap: 15px;
    }
    .btn-outline {
      background: transparent;
      border: 2px solid #f5576c;
      color: #f5576c;
      padding: 8px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }
    .btn-outline:hover {
      background: #f5576c;
      color: #fff;
    }
    .btn-primary {
      background: #f5576c;
      border: none;
      color: #fff;
      padding: 10px 24px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }
    .btn-primary:hover {
      background: #d9435a;
    }
    .btn-danger {
      background: #b33a4a;
      border: none;
      color: #fff;
      padding: 4px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }
    .btn-danger:hover {
      background: #8f2c3a;
    }

    /* Fomu za auth */
    .auth-section {
      display: flex;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    .auth-box {
      background: #1a1a2e;
      padding: 25px 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 350px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }
    .auth-box h2 {
      margin-bottom: 16px;
      font-size: 1.5rem;
      color: #f0f0f5;
      border-bottom: 1px solid #2a2a40;
      padding-bottom: 10px;
    }
    .auth-box input {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 14px;
      border: none;
      border-radius: 30px;
      background: #2a2a40;
      color: #f0f0f5;
      font-size: 1rem;
    }
    .auth-box input:focus {
      outline: 2px solid #f5576c;
    }
    .auth-box button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 30px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
      font-size: 1rem;
    }
    .auth-box .btn-login {
      background: #f5576c;
      color: #fff;
    }
    .auth-box .btn-login:hover {
      background: #d9435a;
    }
    .auth-box .btn-signup {
      background: #4a6fa5;
      color: #fff;
    }
    .auth-box .btn-signup:hover {
      background: #3b5a8a;
    }
    .auth-message {
      color: #ff8a92;
      margin-top: 8px;
      font-size: 0.9rem;
      text-align: center;
    }

    /* Sehemu ya admin baada ya kuingia */
    .admin-panel {
      background: #1a1a2e;
      padding: 25px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      margin-top: 20px;
      display: none; /* inaonekana tu kama admin ameingia */
    }
    .admin-panel.active {
      display: block;
    }

    .admin-panel h2 {
      margin-bottom: 20px;
      border-bottom: 1px solid #2a2a40;
      padding-bottom: 10px;
    }
    .form-add-game {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 25px;
    }
    .form-add-game input,
    .form-add-game textarea {
      padding: 12px 16px;
      border: none;
      border-radius: 30px;
      background: #2a2a40;
      color: #f0f0f5;
      font-size: 1rem;
      width: 100%;
    }
    .form-add-game textarea {
      grid-column: 1 / -1;
      resize: vertical;
      min-height: 70px;
      border-radius: 16px;
    }
    .form-add-game .full-width {
      grid-column: 1 / -1;
    }
    .form-add-game button {
      grid-column: 1 / -1;
      padding: 12px;
      border: none;
      border-radius: 30px;
      background: #f5576c;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
      font-size: 1rem;
    }
    .form-add-game button:hover {
      background: #d9435a;
    }

    /* Orodha ya michezo kwa admin */
    .admin-game-list {
      margin-top: 20px;
    }
    .admin-game-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2a2a40;
      padding: 10px 16px;
      border-radius: 30px;
      margin-bottom: 10px;
    }
    .admin-game-item span {
      font-weight: 500;
    }
    .admin-game-item .delete-btn {
      background: #b33a4a;
      border: none;
      color: #fff;
      padding: 4px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }
    .admin-game-item .delete-btn:hover {
      background: #8f2c3a;
    }
    .no-games-msg {
      color: #8888aa;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 700px) {
      .auth-section { flex-direction: column; align-items: center; }
      .auth-box { max-width: 100%; }
      .form-add-game { grid-template-columns: 1fr; }
      .form-add-game textarea { grid-column: 1; }
      .form-add-game .full-width { grid-column: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎮 DVARY GAMES • Admin</h1>
      <div class="header-actions">
        <a href="index.html" class="btn-outline" style="text-decoration:none;">🏠 Nyumbani</a>
        <button id="logoutBtn" class="btn-outline" style="display:none;">🚪 Toka</button>
      </div>
    </header>

    <!-- Sehemu ya kuingia na kujisajili -->
    <div id="authSection" class="auth-section">
      <!-- Fomu ya Kuingia -->
      <div class="auth-box">
        <h2>🔑 Ingia</h2>
        <input type="email" id="loginEmail" placeholder="Barua pepe" />
        <input type="password" id="loginPassword" placeholder="Nenosiri" />
        <button id="loginBtn" class="btn-login">Ingia</button>
        <div id="loginMessage" class="auth-message"></div>
      </div>

      <!-- Fomu ya Kujisajili -->
      <div class="auth-box">
        <h2>📝 Jisajili</h2>
        <input type="email" id="signupEmail" placeholder="Barua pepe" />
        <input type="password" id="signupPassword" placeholder="Nenosiri" />
        <button id="signupBtn" class="btn-signup">Jisajili</button>
        <div id="signupMessage" class="auth-message"></div>
      </div>
    </div>

    <!-- Paneli ya Admin (inaonekana tu baada ya kuingia) -->
    <div id="adminPanel" class="admin-panel">
      <h2>⚙️ Simamia Michezo</h2>

      <!-- Fomu ya kuongeza game -->
      <form id="addGameForm" class="form-add-game">
        <input type="text" id="gameTitle" placeholder="Jina la mchezo" required />
        <input type="text" id="gameImage" placeholder="URL ya picha (hiari)" />
        <textarea id="gameDescription" placeholder="Maelezo mafupi"></textarea>
        <input type="url" id="gamePlayLink" placeholder="Kiungo cha kucheza (hiari)" />
        <input type="url" id="gameWatchLink" placeholder="Kiungo cha kutazama (hiari)" />
        <button type="submit">➕ Ongeza Mchezo</button>
      </form>

      <!-- Orodha ya michezo iliyopo na kitufe cha kufuta -->
      <div class="admin-game-list" id="adminGameList">
        <p class="no-games-msg">Michezo itaonekana hapa.</p>
      </div>
    </div>

    <footer style="margin-top:40px; text-align:center; color:#555577; font-size:0.9rem;">
      © 2026 DVARY GAMES • Usimamizi
    </footer>
  </div>

  <script type="module">
    import {
      loginUser,
      signupUser,
      logoutUser,
      onAuthStateChanged,
      getGames,
      addGame,
      deleteGame,
      isAdminUser
    } from './app.js';

    // Marejeleo ya vipengele
    const authSection = document.getElementById('authSection');
    const adminPanel = document.getElementById('adminPanel');
    const logoutBtn = document.getElementById('logoutBtn');

    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const loginBtn = document.getElementById('loginBtn');
    const loginMessage = document.getElementById('loginMessage');

    const signupEmail = document.getElementById('signupEmail');
    const signupPassword = document.getElementById('signupPassword');
    const signupBtn = document.getElementById('signupBtn');
    const signupMessage = document.getElementById('signupMessage');

    const addForm = document.getElementById('addGameForm');
    const gameTitle = document.getElementById('gameTitle');
    const gameImage = document.getElementById('gameImage');
    const gameDescription = document.getElementById('gameDescription');
    const gamePlayLink = document.getElementById('gamePlayLink');
    const gameWatchLink = document.getElementById('gameWatchLink');

    const adminGameList = document.getElementById('adminGameList');

    // -----------------------------------------------------------------
    // 1. Usimamizi wa hali ya auth
    // -----------------------------------------------------------------
    function updateUIForUser(user) {
      if (user && isAdminUser(user)) {
        // Admin ameingia
        authSection.style.display = 'none';
        adminPanel.classList.add('active');
        logoutBtn.style.display = 'inline-block';
        // Onyesha michezo kwenye admin panel
        renderAdminGames();
      } else if (user) {
        // Ameingia lakini sio admin
        authSection.style.display = 'none';
        adminPanel.classList.remove('active');
        logoutBtn.style.display = 'inline-block';
        adminGameList.innerHTML = `<p class="no-games-msg">⛔ Huwezi kuona au kubadilisha michezo. Barua pepe yako sio ya admin.</p>`;
      } else {
        // Hajeingia
        authSection.style.display = 'flex';
        adminPanel.classList.remove('active');
        logoutBtn.style.display = 'none';
        // Futa ujumbe
        loginMessage.textContent = '';
        signupMessage.textContent = '';
      }
    }

    // Sikiliza mabadiliko ya hali ya kuingia
    onAuthStateChanged((user) => {
      updateUIForUser(user);
    });

    // -----------------------------------------------------------------
    // 2. Matukio ya kuingia / kujisajili / kutoka
    // -----------------------------------------------------------------
    loginBtn.addEventListener('click', async () => {
      const email = loginEmail.value.trim();
      const password = loginPassword.value.trim();
      if (!email || !password) {
        loginMessage.textContent = 'Tafadhali jaza barua pepe na nenosiri.';
        return;
      }
      try {
        await loginUser(email, password);
        loginMessage.textContent = '✅ Kuingia kumefanikiwa!';
        loginMessage.style.color = '#6fcf97';
      } catch (error) {
        loginMessage.textContent = '❌ ' + error.message;
        loginMessage.style.color = '#ff8a92';
      }
    });

    signupBtn.addEventListener('click', async () => {
      const email = signupEmail.value.trim();
      const password = signupPassword.value.trim();
      if (!email || !password) {
        signupMessage.textContent = 'Tafadhali jaza barua pepe na nenosiri.';
        return;
      }
      if (password.length < 6) {
        signupMessage.textContent = 'Nenosiri lazima liwe angalau herufi 6.';
        return;
      }
      try {
        await signupUser(email, password);
        signupMessage.textContent = '✅ Umesajiliwa! Sasa ingia.';
        signupMessage.style.color = '#6fcf97';
        // Safisha fomu
        signupEmail.value = '';
        signupPassword.value = '';
      } catch (error) {
        signupMessage.textContent = '❌ ' + error.message;
        signupMessage.style.color = '#ff8a92';
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await logoutUser();
      // UI itasasishwa na onAuthStateChanged
    });

    // -----------------------------------------------------------------
    // 3. Kuonyesha michezo kwenye admin panel (pamoja na vitufe vya kufuta)
    // -----------------------------------------------------------------
    async function renderAdminGames() {
      try {
        const games = await getGames();
        if (games.length === 0) {
          adminGameList.innerHTML = `<p class="no-games-msg">😕 Hakuna michezo bado.</p>`;
          return;
        }
        adminGameList.innerHTML = games.map(game => `
          <div class="admin-game-item" data-id="${game.id}">
            <span>${game.title}</span>
            <button class="delete-btn" data-id="${game.id}">🗑️ Futa</button>
          </div>
        `).join('');

        // Weka vikumbusho vya kufuta kwa kila kitufe
        document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const id = e.target.dataset.id;
            if (confirm('Je, una uhakika unataka kufuta mchezo huu?')) {
              try {
                await deleteGame(id);
                renderAdminGames(); // Onyesha upya orodha
              } catch (error) {
                alert('Hitilafu: ' + error.message);
              }
            }
          });
        });
      } catch (error) {
        adminGameList.innerHTML = `<p class="no-games-msg">⚠️ Imeshindwa kupakia michezo.</p>`;
        console.error(error);
      }
    }

    // -----------------------------------------------------------------
    // 4. Kuongeza mchezo
    // -----------------------------------------------------------------
    addForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const newGame = {
        title: gameTitle.value.trim(),
        imageUrl: gameImage.value.trim() || '',
        description: gameDescription.value.trim() || '',
        playLink: gamePlayLink.value.trim() || '',
        watchLink: gameWatchLink.value.trim() || '',
        createdAt: new Date().toISOString()
      };

      // Hakikisha jina lipo
      if (!newGame.title) {
        alert('Tafadhali ingiza jina la mchezo.');
        return;
      }

      try {
        await addGame(newGame);
        // Safisha fomu
        addForm.reset();
        // Onyesha upya orodha
        renderAdminGames();
        alert('✅ Mchezo umeongezwa!');
      } catch (error) {
        alert('❌ Hitilafu: ' + error.message);
      }
    });

    // Iwapo admin tayari ameingia wakati wa kupakia, onyesha michezo
    // (updateUIForUser itaita renderAdminGames ikiwa admin)
  </script>
</body>
  </html>
