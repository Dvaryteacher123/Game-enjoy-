<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVARY GAMES - Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 100%; max-width: 420px; text-align: left; }
        h2 { text-align: center; color: #f43f5e; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #cbd5e1; font-size: 14px; }
        input, textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; box-sizing: border-box; }
        input:focus, textarea:focus { border-color: #f43f5e; outline: none; }
        button[type="submit"] { width: 100%; background: linear-gradient(to right, #f43f5e, #fb7185); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button[type="submit"]:hover { opacity: 0.9; }
        .toggle-container { text-align: center; margin-top: 20px; font-size: 14px; color: #94a3b8; }
        .toggle-btn { background: none; color: #f43f5e; border: none; cursor: pointer; font-weight: bold; text-decoration: underline; padding: 0; font-size: 14px; }
        .error { color: #f87171; font-size: 13px; text-align: center; margin-bottom: 15px; background: rgba(248,113,113,0.1); padding: 8px; border-radius: 4px; }
        .hidden { display: none; }
        .game-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #334155; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; width: auto; }
        .delete-btn:hover { background: #dc2626; }
        .logout-btn { background: #475569 !important; margin-bottom: 15px; }
        hr { border: 0; height: 1px; background: #334155; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <!-- SEHEMU YA AUTHENTICATION (Sign In / Sign Up) -->
    <div id="auth-section">
        <h2 id="form-title">Sign In</h2>
        <p id="form-subtitle" class="subtitle">Ingia kwenye akaunti yako ya admin</p>
        
        <div id="msg" class="error hidden"></div>

        <form id="auth-form">
            <div class="form-group">
                <label>Barua pepe</label>
                <input type="email" id="email" required placeholder="mfano@admin.com">
            </div>
            <div class="form-group">
                <label>Neno la siri</label>
                <input type="password" id="password" required placeholder="********">
            </div>
            <button type="submit" id="auth-btn">Ingia</button>
        </form>

        <div class="toggle-container">
            <span id="toggle-text">Hauna akaunti?</span> 
            <button type="button" id="toggle-auth-mode" class="toggle-btn">Jisajili</button>
        </div>
    </div>

    <!-- SEHEMU YA ADMIN DASHBOARD (Inaonekana ukisha-login) -->
    <div id="dashboard-section" class="hidden">
        <h2>Admin Dashboard</h2>
        <p class="subtitle">Umelogin kama: <span id="user-email-display" style="color: #34d399; font-weight:bold;"></span></p>
        <button type="button" id="logout-btn" class="logout-btn" style="width:100%; padding:10px; border-radius:6px; border:none; color:white; cursor:pointer; font-weight:bold;">Toka (Log Out)</button>
        
        <hr>

        <h3>Ongeza Game Mpya</h3>
        <form id="add-game-form">
            <div class="form-group">
                <label>Jina la Game</label>
                <input type="text" id="game-title" required placeholder="Mfano: Car Racing">
            </div>
            <div class="form-group">
                <label>Maelezo</label>
                <textarea id="game-desc" required placeholder="Maelezo mafupi..."></textarea>
            </div>
            <div class="form-group">
                <label>Link ya Game</label>
                <input type="url" id="game-url" required placeholder="https://...">
            </div>
            <button type="submit">Weka Game</button>
        </form>

        <hr>

        <h3>Orodha ya Michezo</h3>
        <div id="admin-games-list">Inapakia...</div>
    </div>
</div>

<!-- Kuunganisha na app.js -->
<script type="module">
    import { 
        loginUser, 
        signupUser, 
        logoutUser, 
        onAuthStateChanged, 
        isAdminUser, 
        getGames, 
        addGame, 
        deleteGame 
    } from "./app.js";

    const authSection = document.getElementById("auth-section");
    const dashboardSection = document.getElementById("dashboard-section");
    const authForm = document.getElementById("auth-form");
    const formTitle = document.getElementById("form-title");
    const formSubtitle = document.getElementById("form-subtitle");
    const authBtn = document.getElementById("auth-btn");
    const toggleAuthModeBtn = document.getElementById("toggle-auth-mode");
    const toggleText = document.getElementById("toggle-text");
    const msgDiv = document.getElementById("msg");
    const userEmailDisplay = document.getElementById("user-email-display");
    const logoutBtn = document.getElementById("logout-btn");
    const addGameForm = document.getElementById("add-game-form");
    const adminGamesList = document.getElementById("admin-games-list");

    let isSignUpMode = false;

    // Badilisha hali kati ya Sign In na Sign Up kwa ufasaha
    toggleAuthModeBtn.addEventListener("click", () => {
        isSignUpMode = !isSignUpMode;
        if (isSignUpMode) {
            formTitle.innerText = "Sign Up";
            formSubtitle.innerText = "Tengeneza akaunti mpya ya admin";
            authBtn.innerText = "Jisajili";
            toggleText.innerText = "Una akaunti tayari?";
            toggleAuthModeBtn.innerText = "Ingia";
        } else {
            formTitle.innerText = "Sign In";
            formSubtitle.innerText = "Ingia kwenye akaunti yako ya admin";
            authBtn.innerText = "Ingia";
            toggleText.innerText = "Hauna akaunti?";
            toggleAuthModeBtn.innerText = "Jisajili";
        }
        msgDiv.classList.add("hidden");
        msgDiv.innerText = "";
    });

    // Fanya kitendo cha Login au Signup
    authForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        msgDiv.classList.add("hidden");
        msgDiv.innerText = "";

        try {
            if (isSignUpMode) {
                await signupUser(email, password);
                alert("Akaunti imetengenezwa kikamilifu!");
            } else {
                await loginUser(email, password);
            }
        } catch (error) {
            msgDiv.innerText = error.message;
            msgDiv.classList.remove("hidden");
        }
    });

    // Angalia kama mtumiaji amelogin
    onAuthStateChanged(async (user) => {
        if (user) {
            if (isAdminUser(user)) {
                authSection.classList.add("hidden");
                dashboardSection.classList.remove("hidden");
                userEmailDisplay.innerText = user.email;
                loadAdminGamesList();
            } else {
                alert("Akaunti hii haina ruhusa ya kuwa admin!");
                await logoutUser();
            }
        } else {
            authSection.classList.remove("hidden");
            dashboardSection.classList.add("hidden");
        }
    });

    // Logout
    logoutBtn.addEventListener("click", async () => {
        await logoutUser();
    });

    // Ongeza Game
    addGameForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const title = document.getElementById("game-title").value;
        const description = document.getElementById("game-desc").value;
        const gameUrl = document.getElementById("game-url").value;

        try {
            await addGame({ title, description, gameUrl });
            alert("Game imeongezwa kikamilifu!");
            addGameForm.reset();
            loadAdminGamesList();
        } catch (error) {
            alert(error.message);
        }
    });

    // Pakia orodha ya games
    async function loadAdminGamesList() {
        adminGamesList.innerHTML = "Inapakia...";
        try {
            const games = await getGames();
            if (games.length === 0) {
                adminGamesList.innerHTML = "<p style='color:#94a3b8; text-align:center;'>Hakuna michezo iliyowekwa bado.</p>";
                return;
            }

            adminGamesList.innerHTML = "";
            games.forEach(game => {
                const item = document.createElement("div");
                item.className = "game-item";
                item.innerHTML = `
                    <span><b>${game.title}</b></span>
                    <button class="delete-btn" data-id="${game.id}">Futa</button>
                `;
                item.querySelector(".delete-btn").addEventListener("click", async () => {
                    if (confirm(`Una uhakika unataka kufuta "${game.title}"?`)) {
                        try {
                            await deleteGame(game.id);
                            loadAdminGamesList();
                        } catch (err) {
                            alert(err.message);
                        }
                    }
                });
                adminGamesList.appendChild(item);
            });
        } catch (error) {
            adminGamesList.innerHTML = "<p style='color:#f87171;'>Imeshindwa kupakia michezo.</p>";
        }
    }
</script>
</body>
</html>
