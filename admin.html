<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVARY · Admin Panel</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, sans-serif; }
    body {
      background: #0b0d10; color: #eef2f5; padding: 2rem 1.5rem; min-height:100vh;
    }
    .container { max-width: 1100px; margin:0 auto; }
    .admin-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #222a33; padding-bottom: 1.2rem; margin-bottom: 2rem;
      flex-wrap: wrap; gap: 1rem;
    }
    .admin-header h1 {
      font-size: 2rem; font-weight: 700;
      background: linear-gradient(135deg, #e8b630, #f5d742);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .admin-header .user-badge {
      background: #1d262f; padding: 0.4rem 1.2rem; border-radius: 40px;
      border:1px solid #2f3b4a; font-size:0.9rem; display:flex; align-items:center; gap:10px;
    }
    .admin-header .user-badge button {
      background: #3d4a5c; border:none; color:white; padding:0.2rem 1rem; border-radius:30px;
      cursor:pointer; font-weight:600; transition:0.15s;
    }
    .admin-header .user-badge button:hover { background:#e8b630; color:#0b0d10; }

    /* form */
    .form-card {
      background: #14191f; border-radius: 32px; padding: 2rem 2rem 2.2rem;
      border: 1px solid #222a33; margin-bottom: 2.5rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .form-card h2 { margin-bottom: 1.5rem; font-weight:500; color:#d4dcec; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display:block; margin-bottom: 0.3rem; font-weight:500; color:#b0bed4; }
    .form-group input, .form-group textarea {
      width:100%; padding:0.8rem 1rem; background:#1b232c; border:1px solid #2d3845;
      border-radius: 20px; color:#eef2f5; font-size:0.95rem; outline:none; transition:0.15s;
    }
    .form-group input:focus, .form-group textarea:focus { border-color:#e8b630; box-shadow:0 0 0 3px #e8b63033; }
    .form-group textarea { resize:vertical; min-height:70px; }
    .form-row-2 {
      display:grid; grid-template-columns:1fr 1fr; gap:1.2rem;
    }
    .btn-save {
      background:#e8b630; border:none; padding:0.8rem 2.2rem; border-radius:40px;
      font-weight:700; font-size:1rem; color:#0b0d10; cursor:pointer;
      transition:0.15s; box-shadow:0 4px 16px rgba(232,182,48,0.3);
      display:inline-flex; align-items:center; gap:12px;
    }
    .btn-save:hover { background:#f5d03e; transform:scale(1.02); }

    /* game list */
    .list-header { display:flex; justify-content:space-between; margin-bottom:1rem; }
    .list-header h2 { font-weight:400; color:#b9c7dd; }
    .game-list { display:flex; flex-direction:column; gap:0.5rem; }
    .game-item {
      background: #14191f; border:1px solid #26303b; border-radius: 60px;
      padding:0.6rem 1rem 0.6rem 1.8rem;
      display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
      transition:0.1s; gap:0.5rem;
    }
    .game-item:hover { border-color:#e8b63066; background:#1a2129; }
    .game-item .info { display:flex; align-items:center; gap:0.8rem; flex-wrap:wrap; }
    .game-item .info strong { color:#f0f4fc; }
    .game-item .info span { color:#8d9db3; font-size:0.85rem; }
    .game-item .actions button {
      background:#2a3645; border:none; color:#d4dcec; padding:0.3rem 1rem;
      border-radius:40px; cursor:pointer; transition:0.15s;
      border:1px solid #3a485c; font-weight:500;
    }
    .game-item .actions button.delete-btn { background:#4c2a2a; border-color:#7a3a3a; }
    .game-item .actions button.delete-btn:hover { background:#7a3a3a; color:white; }
    .game-item .actions button:hover { background:#3f4e64; }

    .empty-list { padding:2rem; text-align:center; color:#6a7b8f; }
    .toast-msg {
      position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
      background:#1c2530; color:#eef2f5; padding:0.8rem 2rem; border-radius:60px;
      border:1px solid #3a4555; box-shadow:0 8px 24px rgba(0,0,0,0.8);
      font-weight:500; display:none; z-index:999; backdrop-filter:blur(4px);
    }
    .toast-msg.show { display:block; }
    @media(max-width:600px){ .form-row-2{grid-template-columns:1fr;} .game-item{flex-direction:column;align-items:stretch;} }
  </style>
</head>
<body>
<div class="container">
  <div class="admin-header">
    <h1><i class="fas fa-crown" style="color:#e8b630; -webkit-text-fill-color:#e8b630;"></i> DVARY · Admin</h1>
    <div class="user-badge" id="adminUserBadge">
      <i class="fas fa-user-shield"></i> <span id="adminEmailDisplay">...</span>
      <button id="logoutAdminBtn"><i class="fas fa-sign-out-alt"></i> Toka</button>
    </div>
  </div>

  <!-- Fomu ya kuongeza mchezo -->
  <div class="form-card">
    <h2><i class="fas fa-plus-circle" style="color:#e8b630;"></i> Ongeza Mchezo Mpya</h2>
    <form id="gameForm">
      <div class="form-group">
        <label>Jina la Mchezo</label>
        <input type="text" id="gameTitle" placeholder="Mfano: Fortnite" required>
      </div>
      <div class="form-group">
        <label>Maelezo mafupi</label>
        <textarea id="gameDescription" placeholder="Maelezo ya mchezo ..." required></textarea>
      </div>
      <div class="form-row-2">
        <div class="form-group">
          <label>Link ya Picha (URL)</label>
          <input type="url" id="gameImage" placeholder="https://.../picha.jpg" required>
        </div>
        <div class="form-group">
          <label>Link ya kuchezea (gameUrl)</label>
          <input type="url" id="gameUrl" placeholder="https://.../cheza" required>
        </div>
      </div>
      <button type="submit" class="btn-save"><i class="fas fa-save"></i> Hifadhi Mchezo</button>
    </form>
  </div>

  <!-- Orodha ya michezo -->
  <div class="list-header">
    <h2><i class="fas fa-list-ul"></i> Michezo yote</h2>
    <span style="font-size:0.85rem; color:#6a7b8f;" id="gameCount">0</span>
  </div>
  <div id="gamesListContainer" class="game-list">
    <div class="empty-list"><i class="fas fa-spinner fa-spin"></i> Inapakia ...</div>
  </div>
</div>

<!-- toast -->
<div id="toastMessage" class="toast-msg"></div>

<script>
  // ------------------------- FIREBASE CONFIG -------------------------
  const firebaseConfig = {
    apiKey: "AIzaSyDMvYgLyPNhREV6ReCosa7Ia2arDbITPmM",
    authDomain: "dvary-game.firebaseapp.com",
    projectId: "dvary-game",
    storageBucket: "dvary-game.firebasestorage.app",
    messagingSenderId: "184500970711",
    appId: "1:184500970711:web:7f9e0de296d60900c93c92",
    measurementId: "G-P6KSDKFK0S"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  const toast = document.getElementById('toastMessage');
  function showToast(msg, dur = 3000) {
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('show'), dur);
  }

  // DOM
  const form = document.getElementById('gameForm');
  const titleInp = document.getElementById('gameTitle');
  const descInp = document.getElementById('gameDescription');
  const imgInp = document.getElementById('gameImage');
  const urlInp = document.getElementById('gameUrl');
  const listContainer = document.getElementById('gamesListContainer');
  const countSpan = document.getElementById('gameCount');
  const adminEmailSpan = document.getElementById('adminEmailDisplay');

  // ------------------------- ULINZI (AUTH) -------------------------
  auth.onAuthStateChanged(async (user) => {
    if (!user || user.email !== 'dullamanyama0@gmail.com') {
      showToast('⚠️ Haijaruhusiwa. Unaelekezwa index ...', 2000);
      setTimeout(() => { window.location.href = 'index.html'; }, 1500);
      return;
    }
    adminEmailSpan.textContent = user.email;
    subscribeGames();
  });

  // ------------------------- CRUD: SAVE GAME -------------------------
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const gameTitle = titleInp.value.trim();
    const gameDescription = descInp.value.trim();
    const gameImage = imgInp.value.trim();
    const gameUrl = urlInp.value.trim();
    if (!gameTitle || !gameDescription || !gameImage || !gameUrl) {
      showToast('Tafadhali jaza sehemu zote!', 2500);
      return;
    }
    try {
      await db.collection('games').add({
        gameTitle, gameDescription, gameImage, gameUrl,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      form.reset();
      showToast('✅ Mchezo umehifadhiwa!', 2500);
    } catch (err) {
      showToast('❌ Hitilafu: ' + err.message, 3500);
    }
  });

  // ------------------------- READ & DELETE -------------------------
  function renderGameList(snapshot) {
    if (!snapshot || snapshot.empty) {
      listContainer.innerHTML = `<div class="empty-list"><i class="fas fa-gamepad"></i> Hakuna mchezo, ongeza moja!</div>`;
      countSpan.textContent = '0';
      return;
    }
    let html = '';
    snapshot.forEach(doc => {
      const data = doc.data();
      const id = doc.id;
      const title = data.gameTitle || 'No title';
      const desc = data.gameDescription || '';
      html += `
        <div class="game-item" data-id="${id}">
          <div class="info">
            <strong>${title}</strong>
            <span>${desc.substring(0,50)}${desc.length>50?'...':''}</span>
            <span style="font-size:0.7rem; background:#1d262f; padding:0.1rem 0.6rem; border-radius:30px;">${id.slice(0,6)}</span>
          </div>
          <div class="actions">
            <button class="delete-btn" data-id="${id}"><i class="fas fa-trash"></i> Futa</button>
          </div>
        </div>
      `;
    });
    listContainer.innerHTML = html;
    countSpan.textContent = snapshot.size;

    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const docId = btn.dataset.id;
        if (!confirm('Je, una uhakika unataka kufuta mchezo huu?')) return;
        try {
          await db.collection('games').doc(docId).delete();
          showToast('🗑️ Mchezo umefutwa.', 2000);
        } catch (err) {
          showToast('❌ Hitilafu wakati wa kufuta: ' + err.message, 3000);
        }
      });
    });
  }

  function subscribeGames() {
    return db.collection('games').orderBy('gameTitle', 'asc').onSnapshot(snapshot => {
      renderGameList(snapshot);
    }, error => {
      listContainer.innerHTML = `<div class="empty-list"><i class="fas fa-exclamation-triangle"></i> ${error.message}</div>`;
    });
  }

  document.getElementById('logoutAdminBtn').addEventListener('click', async () => {
    await auth.signOut();
    window.location.href = 'index.html';
  });

  console.log('✅ admin.html imeanza · ulinzi wa admin');
</script>
</body>
</html>
