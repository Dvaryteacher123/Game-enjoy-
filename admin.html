<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVARY GAMES - Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 100%; max-width: 420px; text-align: left; }
        h2 { text-align: center; color: #f43f5e; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #cbd5e1; font-size: 14px; }
        input, textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button[type="submit"] { width: 100%; background: linear-gradient(to right, #f43f5e, #fb7185); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button[type="submit"]:hover { opacity: 0.9; }
        .error { color: #f87171; font-size: 13px; text-align: center; margin-bottom: 15px; background: rgba(248,113,113,0.1); padding: 8px; border-radius: 4px; }
        .hidden { display: none !important; }
        .game-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #334155; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; width: auto; }
        .delete-btn:hover { background: #dc2626; }
        .logout-btn { background: #475569 !important; margin-bottom: 15px; width: 100%; padding: 10px; border-radius: 6px; border: none; color: white; cursor: pointer; font-weight: bold; }
        hr { border: 0; height: 1px; background: #334155; margin: 20px 0; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #94a3b8; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <!-- SEHEMU YA KUWEKA EMAIL TU (BILA SIGN IN / SIGN UP) -->
    <div id="login-section">
        <h2>Admin Access</h2>
        <p class="subtitle">Weka email yako ili uingie moja kwa moja</p>
        <div id="msg" class="error hidden"></div>

        <form id="email-form">
            <div class="form-group">
                <label>Email ya Admin</label>
                <input type="email" id="admin-email" required placeholder="dullamanyama0@gmail.com">
            </div>
            <button type="submit">Ingia Kwenye Dashibodi</button>
        </form>
        <a href="index.html" class="back-link">&larr; Rudi kwenye tovuti kuu</a>
    </div>

    <!-- SEHEMU YA ADMIN DASHBOARD -->
    <div id="dashboard-section" class="hidden">
        <h2>Admin Dashboard</h2>
        <p class="subtitle">Umelogin kama: <span id="user-email-display" style="color: #34d399; font-weight:bold;"></span></p>
        <button type="button" id="logout-btn" class="logout-btn">Toka (Log Out)</button>
        
        <hr>

        <h3>Ongeza Game Mpya</h3>
        <form id="add-game-form">
            <div class="form-group">
                <label>Jina la Game</label>
                <input type="text" id="game-title" required placeholder="Mfano: Car Racing">
            </div>
            <div class="form-group">
                <label>Maelezo</label>
                <textarea id="game-desc" required placeholder="Maelezo mafupi..."></textarea>
            </div>
            <div class="form-group">
                <label>Link ya Game</label>
                <input type="url" id="game-url" required placeholder="https://...">
            </div>
            <button type="submit">Weka Game</button>
        </form>

        <hr>

        <h3>Orodha ya Michezo</h3>
        <div id="admin-games-list">Inapakia...</div>
        <a href="index.html" class="back-link">&larr; Rudi kwenye tovuti kuu</a>
    </div>
</div>

<!-- JavaScript -->
<script type="module">
    import { getGames, addGame, deleteGame } from "./app.js";

    const loginSection = document.getElementById("login-section");
    const dashboardSection = document.getElementById("dashboard-section");
    const emailForm = document.getElementById("email-form");
    const adminEmailInput = document.getElementById("admin-email");
    const msgDiv = document.getElementById("msg");
    const userEmailDisplay = document.getElementById("user-email-display");
    const logoutBtn = document.getElementById("logout-btn");
    const addGameForm = document.getElementById("add-game-form");
    const adminGamesList = document.getElementById("admin-games-list");

    // Angalia kama admin alikwishaingia kabla kwenye kivinjari hiki
    const savedAdmin = localStorage.getItem("dvary_admin");
    if (savedAdmin === "dullamanyama0@gmail.com") {
        showDashboard(savedAdmin);
    }

    // Kitendo cha kuingia kwa kutumia email maalum
    emailForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const email = adminEmailInput.value.trim().toLowerCase();
        msgDiv.classList.add("hidden");

        if (email === "dullamanyama0@gmail.com") {
            localStorage.setItem("dvary_admin", email);
            showDashboard(email);
        } else {
            msgDiv.innerText = "Email hii sio ya admin. Ruhusa imekataliwa!";
            msgDiv.classList.remove("hidden");
        }
    });

    function showDashboard(email) {
        loginSection.classList.add("hidden");
        dashboardSection.classList.remove("hidden");
        userEmailDisplay.innerText = email;
        loadAdminGamesList();
    }

    // Kutoka (Logout)
    logoutBtn.addEventListener("click", () => {
        localStorage.removeItem("dvary_admin");
        dashboardSection.classList.add("hidden");
        loginSection.classList.remove("hidden");
        emailForm.reset();
    });

    // Kuongeza Game
    addGameForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const title = document.getElementById("game-title").value;
        const description = document.getElementById("game-desc").value;
        const gameUrl = document.getElementById("game-url").value;

        try {
            await addGame({ title, description, gameUrl });
            alert("Game imeongezwa kikamilifu!");
            addGameForm.reset();
            loadAdminGamesList();
        } catch (error) {
            alert("Imeshindwa kuongeza game: " + error.message);
        }
    });

    // Kuleta orodha ya games
    async function loadAdminGamesList() {
        adminGamesList.innerHTML = "Inapakia...";
        try {
            const games = await getGames();
            if (games.length === 0) {
                adminGamesList.innerHTML = "<p style='color:#94a3b8; text-align:center;'>Hakuna michezo iliyowekwa bado.</p>";
                return;
            }

            adminGamesList.innerHTML = "";
            games.forEach(game => {
                const item = document.createElement("div");
                item.className = "game-item";
                item.innerHTML = `
                    <span><b>${game.title}</b></span>
                    <button class="delete-btn" data-id="${game.id}">Futa</button>
                `;
                item.querySelector(".delete-btn").addEventListener("click", async () => {
                    if (confirm(`Una uhakika unataka kufuta "${game.title}"?`)) {
                        try {
                            await deleteGame(game.id);
                            loadAdminGamesList();
                        } catch (err) {
                            alert("Imeshindwa kufuta: " + err.message);
                        }
                    }
                });
                adminGamesList.appendChild(item);
            });
        } catch (error) {
            adminGamesList.innerHTML = "<p style='color:#f87171;'>Imeshindwa kupakia michezo.</p>";
        }
    }
</script>
</body>
</html>
