<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVARY GAMES - Tovuti Kuu</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 0 auto 30px auto; background: #1e293b; padding: 15px 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { color: #f43f5e; margin: 0; font-size: 24px; }
        .admin-link { background: #f43f5e; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .admin-link:hover { opacity: 0.9; }
        
        .container { max-width: 900px; margin: 0 auto; }
        h2 { color: #cbd5e1; border-bottom: 2px solid #334155; padding-bottom: 10px; margin-bottom: 20px; }
        
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .game-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .game-card h3 { color: #f43f5e; margin-top: 0; margin-bottom: 10px; }
        .game-card p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        .play-btn { background: linear-gradient(to right, #f43f5e, #fb7185); color: white; text-align: center; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; display: block; }
        .play-btn:hover { opacity: 0.9; }
        .loading, .empty { text-align: center; color: #94a3b8; grid-column: 1 / -1; font-size: 16px; padding: 40px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>DVARY GAMES</h1>
        <a href="admin.html" class="admin-link">Admin Panel</a>
    </div>

    <div class="container">
        <h2>Michezo Inayopatikana</h2>
        <div id="public-games-list" class="games-grid">
            <div class="loading">Inapakia michezo...</div>
        </div>
    </div>

    <script type="module">
        import { getGames } from "./app.js";

        const gamesContainer = document.getElementById("public-games-list");

        async function loadPublicGames() {
            try {
                const games = await getGames();
                
                if (games.length === 0) {
                    gamesContainer.innerHTML = '<div class="empty">Hakuna michezo iliyowekwa bado kwa sasa. Rudi tena hivi karibuni!</div>';
                    return;
                }

                gamesContainer.innerHTML = "";
                games.forEach(game => {
                    const card = document.createElement("div");
                    card.className = "game-card";
                    card.innerHTML = `
                        <div>
                            <h3>${game.title}</h3>
                            <p>${game.description}</p>
                        </div>
                        <a href="${game.gameUrl}" target="_blank" class="play-btn">Cheza Sasa</a>
                    `;
                    gamesContainer.appendChild(card);
                });

            } catch (error) {
                gamesContainer.innerHTML = `<div class="empty" style="color: #f87171;">Imeshindwa kupakia michezo: ${error.message}</div>`;
            }
        }

        loadPublicGames();
    </script>
</body>
</html>
