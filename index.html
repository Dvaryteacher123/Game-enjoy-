<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVARY GAMES - Karibu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h1 { color: #ff4757; }
        button, input {
            padding: 10px 15px;
            margin: 10px;
            border-radius: 5px;
            border: none;
        }
        button {
            background-color: #ff4757;
            color: white;
            cursor: pointer;
        }
        button:hover { background-color: #ff6b81; }
        input { width: 80%; max-width: 300px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>DVARY GAMES</h1>
        <p>Tovuti bora ya michezo mtandaoni!</p>
        
        <div id="auth-section">
            <h3>Ingia kama Admin</h3>
            <input type="email" id="email" placeholder="Weka Email yako"><br>
            <input type="password" id="password" placeholder="Weka Password"><br>
            <button onclick="loginAdmin()">Ingia</button>
        </div>

        <div id="admin-link-section" style="display: none;">
            <p>Umelogin kama Admin!</p>
            <button onclick="endaAdmin()">Nenda Admin Panel</button>
            <button onclick="logoutAdmin()" style="background-color: #555;">Toka (Logout)</button>
        </div>
    </div>

    <!-- Firebase SDK (Modular version kupitia CDN au script tags za Web v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDMvYgLyPNhREV6ReCosa7Ia2arDbITPmM",
          authDomain: "dvary-game.firebaseapp.com",
          projectId: "dvary-game",
          storageBucket: "dvary-game.firebasestorage.app",
          messagingSenderId: "184500970711",
          appId: "1:184500970711:web:7f9e0de296d60900c93c92",
          measurementId: "G-P6KSDKFK0S"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const ADMIN_EMAIL = "dullamanyama0@gmail.com";

        // Angalia kama mtu tayari amelogin
        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ADMIN_EMAIL) {
                document.getElementById("auth-section").style.display = "none";
                document.getElementById("admin-link-section").style.display = "block";
            } else {
                document.getElementById("auth-section").style.display = "block";
                document.getElementById("admin-link-section").style.display = "none";
            }
        });

        // Kitendo cha kulogin
        window.loginAdmin = function() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    if (userCredential.user.email === ADMIN_EMAIL) {
                        alert("Umeingia kwa mafanikio!");
                        window.location.href = "admin.html";
                    } else {
                        alert("Huna ruhusa ya kuwa Admin!");
                        signOut(auth);
                    }
                })
                .catch((error) => {
                    alert("Hitilafu: " + error.message);
                });
        }

        // Kwenda admin
        window.endaAdmin = function() {
            window.location.href = "admin.html";
        }

        // Kutoka
        window.logoutAdmin = function() {
            signOut(auth).then(() => {
                alert(" Umetoka kwenye mfumo.");
            });
        }
    </script>
</body>
</html>
