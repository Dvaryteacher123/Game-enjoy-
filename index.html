<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DVARY GAMES - Michezo</title>
  <style>
    /* Muundo wa kisasa, responsive */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f0f1a;
      color: #f0f0f5;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 2px solid #2a2a40;
      margin-bottom: 30px;
    }
    header h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .admin-link {
      background: #2a2a40;
      padding: 10px 20px;
      border-radius: 30px;
      color: #f0f0f5;
      text-decoration: none;
      transition: 0.3s;
    }
    .admin-link:hover {
      background: #f5576c;
      color: #fff;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 25px;
    }
    .game-card {
      background: #1e1e2f;
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }
    .game-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 30px rgba(245, 87, 108, 0.3);
    }
    .game-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #2a2a40;
    }
    .game-card .info {
      padding: 18px 16px 20px;
    }
    .game-card h3 {
      font-size: 1.3rem;
      margin-bottom: 6px;
      color: #fff;
    }
    .game-card p {
      font-size: 0.95rem;
      color: #b0b0c8;
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .game-card .actions {
      display: flex;
      gap: 12px;
    }
    .game-card .actions a {
      padding: 8px 16px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      transition: 0.3s;
      display: inline-block;
      text-align: center;
      flex: 1;
    }
    .btn-play {
      background: #f5576c;
      color: #fff;
    }
    .btn-play:hover {
      background: #d9435a;
    }
    .btn-watch {
      background: #3b3b5a;
      color: #f0f0f5;
    }
    .btn-watch:hover {
      background: #4f4f72;
    }
    .no-games {
      text-align: center;
      padding: 50px 0;
      font-size: 1.3rem;
      color: #8888aa;
    }
    footer {
      margin-top: 50px;
      text-align: center;
      color: #555577;
      font-size: 0.9rem;
    }
    @media (max-width: 600px) {
      header h1 { font-size: 1.8rem; }
      .games-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎮 DVARY GAMES</h1>
      <a href="admin.html" class="admin-link">🔐 Admin</a>
    </header>

    <div id="gamesContainer" class="games-grid">
      <!-- Michezo itaingizwa hapa na JavaScript -->
    </div>
    <footer>© 2026 DVARY GAMES • Michezo zote</footer>
  </div>

  <script type="module">
    // Import kazi zote kutoka app.js
    import { getGames, onAuthStateChanged } from './app.js';

    // Weka mwonekano wa michezo mara tu ukurasa unapopakiwa
    async function displayGames() {
      const container = document.getElementById('gamesContainer');
      try {
        const games = await getGames();
        if (games.length === 0) {
          container.innerHTML = `<p class="no-games">😕 Hakuna michezo bado. Rudi baadaye!</p>`;
          return;
        }
        container.innerHTML = games.map(game => `
          <div class="game-card">
            <img src="${game.imageUrl || 'https://via.placeholder.com/400x180?text=Game'}" alt="${game.title}" />
            <div class="info">
              <h3>${game.title}</h3>
              <p>${game.description || 'Maelezo hayapo.'}</p>
              <div class="actions">
                <a href="${game.playLink || '#'}" target="_blank" class="btn-play">🎯 Cheza</a>
                <a href="${game.watchLink || '#'}" target="_blank" class="btn-watch">👁️ Tazama</a>
              </div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Hitilafu wakati wa kuleta michezo:', error);
        container.innerHTML = `<p class="no-games">⚠️ Imeshindwa kupakia michezo. Jaribu tena.</p>`;
      }
    }

    // Ondoka kwenye mabadiliko ya hali ya auth (hakuna haja, lakini tunaweza kusikiliza)
    onAuthStateChanged((user) => {
      // Hakuna kitendo maalum, lakini inaweza kutumika baadaye
    });

    // Pakia michezo
    displayGames();
  </script>
</body>
</html>
