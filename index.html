<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVARY GAMES · Index</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #0b0d10;
      color: #eef2f5;
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
    }

    /* header + admin login */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid #2a2f36;
      padding-bottom: 1.2rem;
    }

    .logo h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #e8b630, #f5d742);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 12px rgba(232, 182, 48, 0.3);
    }
    .logo span {
      font-size: 0.9rem;
      color: #8e9aaf;
      -webkit-text-fill-color: #8e9aaf;
      background: none;
      margin-left: 8px;
      font-weight: 300;
    }

    .admin-login-area {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
      background: #181c22;
      padding: 0.4rem 0.8rem 0.4rem 1.2rem;
      border-radius: 40px;
      border: 1px solid #2f3640;
    }
    .admin-login-area input {
      background: transparent;
      border: none;
      padding: 0.5rem 0.3rem;
      color: #d4dcec;
      font-size: 0.9rem;
      width: 140px;
      outline: none;
    }
    .admin-login-area input::placeholder {
      color: #5f6b7a;
      font-weight: 300;
    }
    .admin-login-area button {
      background: #2f3b4a;
      border: none;
      color: white;
      padding: 0.45rem 1.2rem;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #3d485a;
    }
    .admin-login-area button:hover {
      background: #3e4c60;
      border-color: #e8b630;
      color: #f5e27a;
    }
    .admin-login-area .status-badge {
      font-size: 0.75rem;
      color: #81b29a;
      padding-left: 6px;
    }

    /* grid games */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 2rem 1.8rem;
      margin-top: 1rem;
    }

    .game-card {
      background: #14191f;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(0,0,0,0.7);
      transition: transform 0.2s ease, box-shadow 0.2s;
      border: 1px solid #222a33;
      display: flex;
      flex-direction: column;
    }
    .game-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 20px 36px rgba(0,0,0,0.9);
      border-color: #e8b63044;
    }

    .card-img {
      width: 100%;
      height: 170px;
      background: #1f2832;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.2s;
    }
    .card-img img:not([src]), .card-img img[src=""] {
      opacity: 0.3;
    }

    .card-body {
      padding: 1.2rem 1.2rem 1.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .card-body h3 {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
      color: #f0f4fc;
      letter-spacing: -0.2px;
    }
    .card-body .desc {
      font-size: 0.9rem;
      color: #a6b4c9;
      margin: 0.4rem 0 1rem;
      line-height: 1.4;
      flex: 1;
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.5rem;
    }
    .play-btn {
      background: #e8b630;
      border: none;
      padding: 0.5rem 1.3rem;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.8rem;
      color: #0b0d10;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 4px 12px rgba(232, 182, 48, 0.25);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .play-btn:hover {
      background: #f5d03e;
      transform: scale(1.02);
      box-shadow: 0 6px 16px rgba(232, 182, 48, 0.4);
    }
    .game-id-tag {
      font-size: 0.65rem;
      background: #1d262f;
      padding: 0.2rem 0.7rem;
      border-radius: 30px;
      color: #7a8a9e;
      letter-spacing: 0.3px;
    }

    .empty-message {
      text-align: center;
      padding: 3rem 0;
      color: #6f7d91;
      font-size: 1.1rem;
      grid-column: 1 / -1;
    }

    .footer-note {
      margin-top: 3rem;
      font-size: 0.8rem;
      text-align: center;
      color: #2d3642;
      border-top: 1px solid #1d242c;
      padding-top: 2rem;
    }

    /* toast */
    .toast-msg {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #1c2530;
      color: #eef2f5;
      padding: 0.8rem 2rem;
      border-radius: 60px;
      border: 1px solid #3a4555;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
      font-weight: 500;
      backdrop-filter: blur(4px);
      z-index: 999;
      display: none;
    }
    .toast-msg.show {
      display: block;
    }

    @media (max-width: 600px) {
      .top-bar { flex-direction: column; align-items: stretch; gap: 1rem; }
      .admin-login-area { justify-content: stretch; }
      .admin-login-area input { width: 100%; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- header -->
  <div class="top-bar">
    <div class="logo">
      <h1>⚡ DVARY GAMES <span>· arena</span></h1>
    </div>
    <div class="admin-login-area" id="adminLoginSection">
      <input type="email" id="loginEmail" placeholder="Admin email" value="dullamanyama0@gmail.com">
      <input type="password" id="loginPassword" placeholder="Nenosiri">
      <button id="loginAdminBtn"><i class="fas fa-user-shield"></i> Ingia</button>
      <span class="status-badge" id="loginStatus"></span>
    </div>
  </div>

  <!-- grid ya michezo -->
  <div id="gamesContainer" class="games-grid">
    <div class="empty-message"><i class="fas fa-spinner fa-spin"></i> Inapakia michezo ...</div>
  </div>
  <div class="footer-note">DVARY · michezo yote inapatikana kwenye Firestore</div>
</div>

<!-- toast -->
<div id="toastMessage" class="toast-msg"></div>

<script>
  // ------------------------- FIREBASE CONFIG -------------------------
  const firebaseConfig = {
    apiKey: "AIzaSyDMvYgLyPNhREV6ReCosa7Ia2arDbITPmM",
    authDomain: "dvary-game.firebaseapp.com",
    projectId: "dvary-game",
    storageBucket: "dvary-game.firebasestorage.app",
    messagingSenderId: "184500970711",
    appId: "1:184500970711:web:7f9e0de296d60900c93c92",
    measurementId: "G-P6KSDKFK0S"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  // DOM refs
  const gamesContainer = document.getElementById('gamesContainer');
  const toast = document.getElementById('toastMessage');

  // ------------------------- HELPERS -------------------------
  function showToast(msg, duration = 3000) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
  }

  // render games from snapshot
  function renderGames(snapshot) {
    if (!snapshot || snapshot.empty) {
      gamesContainer.innerHTML = `<div class="empty-message"><i class="fas fa-gamepad"></i> Hakuna mchezo bado. Ongeza kupitia admin.</div>`;
      return;
    }
    let html = '';
    snapshot.forEach(doc => {
      const data = doc.data();
      const id = doc.id;
      const title = data.gameTitle || 'Jina lisilojulikana';
      const desc = data.gameDescription || '';
      const img = data.gameImage || '';
      const url = data.gameUrl || '#';
      html += `
        <div class="game-card" data-id="${id}">
          <div class="card-img">
            <img src="${img}" alt="${title}" onerror="this.style.display='none'">
          </div>
          <div class="card-body">
            <h3>${title}</h3>
            <div class="desc">${desc}</div>
            <div class="card-footer">
              <a href="${url}" target="_blank" class="play-btn"><i class="fas fa-play"></i> Play Now</a>
              <span class="game-id-tag">#${id.slice(0,6)}</span>
            </div>
          </div>
        </div>
      `;
    });
    gamesContainer.innerHTML = html;
  }

  // fetch games realtime
  function subscribeGames() {
    return db.collection('games').orderBy('gameTitle', 'asc').onSnapshot(snapshot => {
      renderGames(snapshot);
    }, error => {
      console.error('Firestore error:', error);
      gamesContainer.innerHTML = `<div class="empty-message"><i class="fas fa-exclamation-triangle"></i> Hitilafu: ${error.message}</div>`;
    });
  }

  // ------------------------- AUTH STATE (index) -------------------------
  auth.onAuthStateChanged(user => {
    const statusEl = document.getElementById('loginStatus');
    if (user) {
      if (user.email === 'dullamanyama0@gmail.com') {
        statusEl.innerHTML = '<i class="fas fa-check-circle" style="color:#81b29a;"></i> Admin ndani';
        // Ongeza kitufe cha kwenda admin
        const loginSection = document.getElementById('adminLoginSection');
        let goAdminBtn = document.getElementById('goAdminBtn');
        if (!goAdminBtn) {
          goAdminBtn = document.createElement('a');
          goAdminBtn.id = 'goAdminBtn';
          goAdminBtn.href = 'admin.html';
          goAdminBtn.innerHTML = '<i class="fas fa-arrow-right"></i> Nenda admin';
          goAdminBtn.style.cssText = 'background:#e8b630; color:#0b0d10; padding:0.3rem 1rem; border-radius:30px; text-decoration:none; font-weight:600; margin-left:8px; font-size:0.8rem; border:1px solid #f5d742;';
          loginSection.appendChild(goAdminBtn);
        }
      } else {
        statusEl.innerHTML = '<i class="fas fa-user"></i> Mtumiaji';
      }
    } else {
      statusEl.innerHTML = '<i class="fas fa-circle" style="color:#6f7d91;"></i> Hujaingia';
    }
  });

  // ------------------------- LOGIN ADMIN (index) -------------------------
  document.getElementById('loginAdminBtn').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    if (!email || !password) {
      showToast('Tafadhali jaza email na nenosiri', 2500);
      return;
    }
    try {
      const cred = await auth.signInWithEmailAndPassword(email, password);
      if (cred.user.email === 'dullamanyama0@gmail.com') {
        showToast('✅ Kuingia kumefanikiwa! Unaweza kwenda admin.html', 3000);
      } else {
        showToast('⚠️ Barua pepe si ya admin (dullamanyama0@gmail.com)', 3000);
        await auth.signOut();
      }
    } catch (err) {
      showToast('❌ Hitilafu: ' + err.message, 3500);
    }
  });

  // ------------------------- START APP -------------------------
  let unsubscribe = subscribeGames();

  window.addEventListener('load', () => {
    showToast('👾 DVARY GAMES · karibu!', 2000);
  });

  console.log('✅ index.html imeanza · Firestore + Auth');
</script>
</body>
</html>
